<section class="card">
  <header class="header">
    <h1 class="title">Buscador de Pokémon</h1>
    <p class="subtitle">Escribe un nombre y descubre su imagen usando la PokeAPI.</p>
  </header>

  <form class="search" (ngSubmit)="search()">
    <input
      class="input"
      type="text"
      name="query"
      [(ngModel)]="query"
      placeholder="Ej: ditto, pikachu, charizard..."
      autocomplete="off"
      aria-label="Nombre del Pokémon"
    />
    <button class="button" type="submit" [disabled]="loading">
      {{ loading ? 'Buscando...' : 'Buscar' }}
    </button>
  </form>

  <p class="error" *ngIf="error" role="alert">{{ error }}</p>

  <div class="result" *ngIf="pokemon && !error">
    <div class="image-wrap">
      <img
        *ngIf="pokemon.image; else noImage"
        class="image"
        [src]="pokemon.image"
        [alt]="'Imagen de ' + pokemon.name"
      />
      <ng-template #noImage>
        <span class="no-image">Sin imagen disponible</span>
      </ng-template>
    </div>

    <h2 class="name">{{ pokemon.name }}</h2>

    <dl class="stats">
      <div class="stat">
        <dt>Tipo</dt>
        <dd>{{ pokemon.types.join(' / ') }}</dd>
      </div>
      <div class="stat">
        <dt>Altura</dt>
        <dd>{{ pokemon.height.toLocaleString('es') }} m</dd>
      </div>
      <div class="stat">
        <dt>Peso</dt>
        <dd>{{ pokemon.weight.toLocaleString('es') }} kg</dd>
      </div>
    </dl>
  </div>
</section>
