<div class="shell">
  <header class="topbar">
    <h1 class="brand">Bienvenidos al buscador Pokemon con mas Aura</h1>
    <nav class="nav" aria-label="Navegación principal">
      <a routerLink="/registro" routerLinkActive="active">Registro Usuario</a>
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        Buscador Pokemon
      </a>
      <a
        *ngFor="let p of pokemons"
        [routerLink]="'/' + p"
        routerLinkActive="active"
      >
        {{ p | titlecase }}
      </a>
    </nav>
  </header>

  <main class="content">
    <router-outlet />
  </main>
</div>
